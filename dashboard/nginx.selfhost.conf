# Self-hosted production: serves the static dashboard and reverse-proxies the
# API, so the browser only ever talks to this one origin (the same job the Vite
# dev proxy does in docker-compose.yml). nginx.conf is the hosted-site config
# (hardcoded domains, no proxy) and is left untouched.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Using variables in proxy_pass makes nginx resolve
    # the upstreams per request instead of failing to start if one is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend  http://backend:8000;
    set $renderer http://renderer:3100;

    # Video uploads and long-running requests: no body cap, no request
    # buffering to disk, generous timeouts.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/       { proxy_pass $backend; }
    location /videos/    { proxy_pass $backend; }
    location /thumbnails/ { proxy_pass $backend; }
    location /gallery    { proxy_pass $backend; }
    location /video/     { proxy_pass $backend; }
    location /health     { proxy_pass $backend; }
    location /render     { proxy_pass $renderer; }

    location = /pricing {
        return 301 /#/pricing;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
