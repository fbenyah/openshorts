# Production stack (self-host, bring-your-own-keys). Standalone: do not combine
# with docker-compose.yml, whose bind mounts and dev server are for development.
#
#   cp .env.example .env        # add your keys (or leave empty and use the UI)
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Open http://localhost:${HTTP_PORT:-8080}. Only the nginx frontend is
# published; it proxies /api, /videos, /render... to the internal services.
# Put a TLS-terminating reverse proxy in front for public hosting.
name: openshorts

services:
  backend:
    build:
      context: .
      args:
        GPU: ${GPU:-0}
    # The image has no .env (dockerignored), so the runtime env comes from here.
    env_file:
      - path: .env
        required: false
    environment:
      - RENDER_SERVICE_URL=http://renderer:3100
    volumes:
      - output:/app/output
      - uploads:/app/uploads
      - hf-cache:/app/.cache/huggingface
    # Must stay above DRAIN_TIMEOUT_SECONDS (default 840).
    stop_grace_period: 900s
    restart: unless-stopped

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    volumes:
      - output:/output
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: selfhost
      args:
        # Empty = same origin; nginx proxies the API.
        VITE_API_URL: ""
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      renderer:
        condition: service_healthy
    restart: unless-stopped

volumes:
  output:
  uploads:
  hf-cache:
